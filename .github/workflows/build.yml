name: Build mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Forge MDK and unpack project
        run: |
          curl -L -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/forge-1.7.10-10.13.4.1614-1.7.10-src.zip"
          unzip -q mdk.zip -d mdk
          unzip -q KhalilCreatures-source.zip -d proj

      - name: Build
        run: |
          rm -rf mdk/src/main/java/com/example
          cp -r proj/src mdk/
          cp proj/build.gradle mdk/build.gradle

          mkdir -p mdk/build/unpacked
          curl -fL "https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar" -o mdk/build/unpacked/1.7.10.jar

          cd mdk
          chmod +x gradlew

          mkdir -p ~/.gradle/caches/minecraft/assets/indexes
          echo '{"objects":{}}' > ~/.gradle/caches/minecraft/assets/indexes/1.7.10.json

          ./gradlew setupDecompWorkspace build --no-daemon

          cp build/libs/KhalilCreatures-1.7.10.jar ../

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: KhalilCreatures-1.7.10
          path: KhalilCreatures-1.7.10.jar
