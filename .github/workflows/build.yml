name: Build mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Download Forge MDK and unpack project
        run: |
          curl -L -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/forge-1.7.10-10.13.4.1614-1.7.10-src.zip"
          unzip -q mdk.zip -d mdk
          unzip -q KhalilCreatures-source.zip -d proj
      - name: Build
        run: |
          rm -rf mdk/src/main/java/com/example
          cp -r proj/src mdk/
          cp proj/build.gradle mdk/build.gradle
          cd mdk
          chmod +x gradlew
          ./gradlew setupDecompWorkspace build --no-daemon
          cp build/libs/KhalilCreatures-1.7.10.jar ../
      - uses: actions/upload-artifact@v4
        with:
          name: KhalilCreatures-1.7.10
          path: KhalilCreatures-1.7.10.jar
